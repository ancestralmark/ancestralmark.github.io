<script>
/* Adresele Kids cu bara la sfarsit (/kids/ro/) nu exista ca foldere: le trimitem

(function(){
  var L=" ar ca cs da de el en es fi fr hr hu it lt nl no pl pt ro sk sl sq sr sv uk ";
  var p=location.pathname, m=p.match(/^\/kids\/([a-z]{2})\/+(?:index\.html)?$/i);
  if (m && L.indexOf(" "+m[1].toLowerCase()+" ")>=0){ location.replace("/kids/"+m[1].toLowerCase()); return; }
  location.replace(p.toLowerCase().indexOf("/kids")===0 ? "/kids/" : "/");
})();
</script>
